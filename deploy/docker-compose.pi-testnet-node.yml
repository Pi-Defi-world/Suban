# Pi Testnet Node
# Horizon API: http://localhost:42401 | Peer: 42402 | RPC: 42403
#
# The stock image's `--testnet2` flag hardcodes a stale validator set and an
# abandoned history archive, and ships Horizon with autostart=false. The
# entrypoint wrapper stages corrected configs before handing off to /start.
services:
  pi-testnet:
    image: pinetwork/pi-node-docker:community-v1.0-p28.0.1
    container_name: pi-testnet
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/etc/suban/entrypoint.sh"]
    ports:
      - "42401:8000"
      - "42402:31402"
      - "42403:8003"
    volumes:
      - "pi-testnet-data:/opt/stellar"
      - "./pi-testnet-entrypoint.sh:/etc/suban/entrypoint.sh:ro"
      - "./pi-testnet-core.cfg:/etc/suban/pi-testnet-core.cfg:ro"
      - "./pi-testnet-horizon-core.yml:/etc/suban/pi-testnet-horizon-core.yml:ro"
      - "./pi-testnet-horizon.env:/etc/suban/pi-testnet-horizon.env:ro"
      - "./pi-testnet-horizon-ensure.sh:/etc/suban/horizon-ensure.sh:ro"
    environment:
      - POSTGRES_PASSWORD=pi-testnet-pg
    command: ["--testnet2"]

volumes:
  pi-testnet-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test

  services:
    name: Service ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [services/bridge-relayer, services/event-indexer]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  frontend:
    name: Escrow viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/escrow-viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  solidity:
    name: Arc bridge (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/arc-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Blocking: no secrets in the working tree.
      # Uses the gitleaks CLI container (no org license required, unlike the
      # gitleaks GitHub Action).
      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect --no-git \
            --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
      # Non-blocking: known secrets remain in git history until it is purged
      # (see PLAN-EXECUTION.md, defect D3). This reports them without failing CI.
      - name: Scan git history (report only)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
